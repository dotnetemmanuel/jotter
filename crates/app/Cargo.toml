[package]
name = "jotter-app"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
jotter-editor = { version = "0.1.0", path = "../editor" }
jotter-index = { version = "0.1.0", path = "../index" }
jotter-parser = { version = "0.1.0", path = "../parser" }
jotter-preview = { version = "0.1.0", path = "../preview" }
jotter-search = { version = "0.1.0", path = "../search" }
jotter-theming = { version = "0.1.0", path = "../theming" }
jotter-vault = { version = "0.1.0", path = "../vault" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"

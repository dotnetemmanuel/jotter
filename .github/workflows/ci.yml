name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install GTK system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install GTK system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev
      - run: cargo test --locked --workspace

  # GTK4, GtkSourceView and WebKitGTK do not build on macOS or Windows, so these runners cover crates/ only.
  test-portable:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Derive the crates/ package list
        id: crates
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          workspace_root="$(echo "$metadata" | jq -r '.workspace_root')"
          packages="$(echo "$metadata" | jq -r --arg root "$workspace_root/crates/" '.packages[] | select(.manifest_path | startswith($root)) | .name')"
          if [ -z "$packages" ]; then
            echo "test-portable: found no packages under crates/, refusing to pass on an empty check"
            exit 1
          fi
          args=""
          while IFS= read -r pkg; do
            args="$args --package $pkg"
          done <<< "$packages"
          echo "package_args=$args" >> "$GITHUB_OUTPUT"
      - name: Build crates
        run: cargo build --locked ${{ steps.crates.outputs.package_args }}
      - name: Test crates
        run: cargo test --locked ${{ steps.crates.outputs.package_args }}

  # Fails if any crate under crates/ pulls in GTK, GLib, or their transitive libraries.
  guard-core-is-gui-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Guard core crates against GTK dependencies
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          workspace_root="$(echo "$metadata" | jq -r '.workspace_root')"
          packages="$(echo "$metadata" | jq -r --arg root "$workspace_root/crates/" '.packages[] | select(.manifest_path | startswith($root)) | .name')"
          if [ -z "$packages" ]; then
            echo "guard-core-is-gui-free: found no packages under crates/, refusing to pass on an empty check"
            exit 1
          fi
          forbidden='gtk|glib|gdk|pango|webkit|sourceview|gobject|graphene|cairo'
          failed=0
          while IFS= read -r pkg; do
            echo "checking $pkg"
            tree_output="$(cargo tree --edges normal --all-features --package "$pkg")"
            if matches="$(echo "$tree_output" | grep -Ei "$forbidden")"; then
              echo "GTK dependency found in $pkg:"
              echo "$matches"
              failed=1
            fi
          done <<< "$packages"
          if [ "$failed" -ne 0 ]; then
            echo "guard-core-is-gui-free: FAILED"
            exit 1
          fi
          echo "guard-core-is-gui-free: PASSED"
